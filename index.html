<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>News Audio Q&A</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      padding: 20px;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    .container {
      background: white;
      border-radius: 12px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
      max-width: 600px;
      width: 100%;
      padding: 30px;
    }
    h1 {
      color: #667eea;
      font-size: 28px;
      margin-bottom: 10px;
      text-align: center;
    }
    p {
      color: #666;
      margin-bottom: 20px;
      text-align: center;
      font-size: 14px;
    }
    .section {
      margin-bottom: 25px;
    }
    .section-title {
      font-size: 16px;
      font-weight: 600;
      color: #333;
      margin-bottom: 10px;
    }
    label {
      display: block;
      font-size: 14px;
      font-weight: 500;
      color: #555;
      margin-bottom: 5px;
    }
    input[type="text"],
    input[type="number"] {
      width: 100%;
      padding: 10px 12px;
      border: 2px solid #e0e0e0;
      border-radius: 6px;
      font-size: 14px;
      transition: border-color 0.3s;
    }
    input[type="text"]:focus,
    input[type="number"]:focus {
      outline: none;
      border-color: #667eea;
    }
    .input-group {
      margin-bottom: 15px;
    }
    button {
      width: 100%;
      padding: 12px;
      background: #667eea;
      color: white;
      border: none;
      border-radius: 6px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.3s, transform 0.1s;
    }
    button:hover {
      background: #5568d3;
    }
    button:active {
      transform: scale(0.98);
    }
    button:disabled {
      background: #ccc;
      cursor: not-allowed;
      transform: none;
    }
    .button-secondary {
      background: #764ba2;
    }
    .button-secondary:hover {
      background: #653a8a;
    }
    .button-tertiary {
      background: #48bb78;
    }
    .button-tertiary:hover {
      background: #38a169;
    }
    .button-group {
      display: flex;
      gap: 10px;
      margin-top: 10px;
    }
    .button-group button {
      flex: 1;
    }
    .prompt {
      background: #f7fafc;
      padding: 15px;
      border-radius: 6px;
      border-left: 4px solid #667eea;
      margin-bottom: 15px;
      font-size: 14px;
      color: #333;
    }
    .answer {
      background: #edf2f7;
      padding: 15px;
      border-radius: 6px;
      border-left: 4px solid #48bb78;
      font-size: 14px;
      color: #333;
      min-height: 50px;
    }
    .articles {
      list-style: decimal;
      padding-left: 20px;
      margin-top: 15px;
      max-height: 300px;
      overflow-y: auto;
    }
    .articles li {
      margin-bottom: 10px;
      font-size: 13px;
      color: #555;
      line-height: 1.5;
    }
    .voice-btn {
      background: #e53e3e;
      position: relative;
      min-width: 60px;
    }
    .voice-btn:hover {
      background: #c53030;
    }
    .voice-btn.recording {
      background: #e53e3e;
      animation: pulse 1.5s ease-in-out infinite;
    }
    .voice-btn.recording::after {
      content: "🎤 Listening...";
      position: absolute;
      top: -30px;
      left: 50%;
      transform: translateX(-50%);
      background: #e53e3e;
      color: white;
      padding: 5px 10px;
      border-radius: 4px;
      font-size: 12px;
      white-space: nowrap;
      box-shadow: 0 2px 8px rgba(0,0,0,0.2);
    }
    @keyframes pulse {
      0%, 100% {
        box-shadow: 0 0 0 0 rgba(229, 62, 62, 0.7);
      }
      50% {
        box-shadow: 0 0 0 10px rgba(229, 62, 62, 0);
      }
    }
    .voice-mode-toggle {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 15px;
      padding: 10px;
      background: #f7fafc;
      border-radius: 6px;
    }
    .voice-mode-toggle label {
      font-size: 14px;
      font-weight: 500;
      color: #555;
      margin: 0;
    }
    .switch {
      position: relative;
      display: inline-block;
      width: 50px;
      height: 24px;
    }
    .switch input {
      opacity: 0;
      width: 0;
      height: 0;
    }
    .slider {
      position: absolute;
      cursor: pointer;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background-color: #ccc;
      transition: 0.4s;
      border-radius: 24px;
    }
    .slider:before {
      position: absolute;
      content: "";
      height: 18px;
      width: 18px;
      left: 3px;
      bottom: 3px;
      background-color: white;
      transition: 0.4s;
      border-radius: 50%;
    }
    input:checked + .slider {
      background-color: #667eea;
    }
    input:checked + .slider:before {
      transform: translateX(26px);
    }
    .status-indicator {
      font-size: 12px;
      color: #666;
      font-style: italic;
      margin-top: 5px;
    }
    @media (max-width: 600px) {
      .container {
        padding: 20px;
      }
      h1 {
        font-size: 24px;
      }
      .button-group {
        flex-direction: column;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>News Audio Q&amp;A</h1>
    <p>Enter topic and ask up to 3 questions about the fetched news articles.</p>

    <div class="section">
      <div class="section-title">Setup</div>
      <div class="input-group">
        <label for="topic">Topic:</label>
        <input type="text" id="topic" placeholder="technology" />
      </div>
      <div class="input-group">
        <label for="limit">Number of Articles (1-20):</label>
        <input type="number" id="limit" min="1" max="20" value="5" />
      </div>
      <button id="start-btn">Start Session</button>
    </div>

    <div class="section">
      <div class="section-title">Articles</div>
      <ol id="articles" class="articles"></ol>
      <button id="read-btn" class="button-tertiary" disabled>Read All Aloud</button>
    </div>

    <div class="section">
      <div class="section-title">Question Prompt</div>
      <div id="prompt" class="prompt">Click "Start Session" to begin.</div>
    </div>

    <div class="section">
      <div class="section-title">Your Question</div>
      <div class="voice-mode-toggle">
        <label class="switch">
          <input type="checkbox" id="voice-mode-toggle">
          <span class="slider"></span>
        </label>
        <label for="voice-mode-toggle">🎤 Voice Mode (Auto-speak answers)</label>
      </div>
      <div class="input-group">
        <input type="text" id="question" placeholder="e.g., how many articles?" />
      </div>
      <div class="button-group">
        <button id="voice-btn" class="voice-btn" disabled title="Click to ask via voice">🎤 Voice</button>
        <button id="submit-btn" class="button-secondary" disabled>Submit</button>
        <button id="next-btn" disabled>Next</button>
      </div>
      <div id="voice-status" class="status-indicator"></div>
    </div>

    <div class="section">
      <div class="section-title">Answer</div>
      <div id="answer" class="answer">Your answer will appear here.</div>
    </div>
  </div>

  <script>
    (function () {
      const NEWS_API_URL = "https://hn.algolia.com/api/v1/search";
      const DEFAULT_TOPIC = "technology";
      const MIN_KEYWORD_LENGTH = 3;
      const MAX_ARTICLES_LIMIT = 20;

      const fallbackArticles = [
        {
          title: "Open-source AI tools continue to expand",
          description: "Developers are adopting open-source AI stacks for rapid prototyping.",
          source: "Offline sample",
          url: ""
        },
        {
          title: "Cybersecurity teams focus on supply-chain risks",
          description: "Organizations increase dependency audits and automated checks.",
          source: "Offline sample",
          url: ""
        },
        {
          title: "Cloud costs drive renewed optimization efforts",
          description: "Engineering teams revisit right-sizing and workload scheduling.",
          source: "Offline sample",
          url: ""
        }
      ];

      const topicInput = document.getElementById("topic");
      const limitInput = document.getElementById("limit");
      const startBtn = document.getElementById("start-btn");
      const articlesEl = document.getElementById("articles");
      const readBtn = document.getElementById("read-btn");
      const promptEl = document.getElementById("prompt");
      const questionInput = document.getElementById("question");
      const submitBtn = document.getElementById("submit-btn");
      const nextBtn = document.getElementById("next-btn");
      const answerEl = document.getElementById("answer");
      const voiceBtn = document.getElementById("voice-btn");
      const voiceModeToggle = document.getElementById("voice-mode-toggle");
      const voiceStatus = document.getElementById("voice-status");

      const state = {
        articles: [],
        articleTexts: [],
        turn: 0,
        rounds: 3,
        voiceMode: false,
        recognition: null,
        isRecording: false
      };

      topicInput.value = DEFAULT_TOPIC;

      // Initialize Speech Recognition
      function initSpeechRecognition() {
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        if (!SpeechRecognition) {
          voiceStatus.textContent = "⚠️ Speech recognition not supported in this browser";
          voiceBtn.disabled = true;
          return null;
        }

        const recognition = new SpeechRecognition();
        recognition.continuous = false;
        recognition.interimResults = false;
        recognition.lang = 'en-US';

        recognition.onstart = () => {
          state.isRecording = true;
          voiceBtn.classList.add('recording');
          voiceStatus.textContent = "🎤 Listening... Speak your question";
        };

        recognition.onresult = (event) => {
          const transcript = event.results[0][0].transcript;
          questionInput.value = transcript;
          voiceStatus.textContent = `✓ Heard: "${transcript}"`;
          // Automatically submit the question
          setTimeout(() => {
            if (state.articles.length && state.turn < state.rounds) {
              submitBtn.click();
            }
          }, 500);
        };

        recognition.onerror = (event) => {
          state.isRecording = false;
          voiceBtn.classList.remove('recording');
          if (event.error === 'no-speech') {
            voiceStatus.textContent = "⚠️ No speech detected. Try again.";
          } else if (event.error === 'not-allowed') {
            voiceStatus.textContent = "⚠️ Microphone access denied. Please enable it.";
          } else {
            voiceStatus.textContent = `⚠️ Error: ${event.error}`;
          }
        };

        recognition.onend = () => {
          state.isRecording = false;
          voiceBtn.classList.remove('recording');
          if (!questionInput.value) {
            voiceStatus.textContent = "";
          }
        };

        return recognition;
      }

      // Text-to-Speech function for answers
      function speakAnswer(text) {
        if (!state.voiceMode || !('speechSynthesis' in window)) return;
        
        // Cancel any ongoing speech
        window.speechSynthesis.cancel();
        
        const utterance = new SpeechSynthesisUtterance(text);
        utterance.rate = 1.0;
        utterance.pitch = 1.0;
        utterance.volume = 1.0;
        
        // Choose a voice (prefer female voice if available)
        const voices = window.speechSynthesis.getVoices();
        if (voices.length > 0) {
          const preferredVoice = voices.find(voice => 
            voice.lang.startsWith('en') && voice.name.includes('Female')
          ) || voices.find(voice => voice.lang.startsWith('en')) || voices[0];
          
          if (preferredVoice) {
            utterance.voice = preferredVoice;
          }
        }
        
        window.speechSynthesis.speak(utterance);
      }

      // Initialize speech recognition on page load
      state.recognition = initSpeechRecognition();

      function normalizeLimit(value) {
        const parsed = Number(value);
        if (isNaN(parsed) || parsed < 1) return 5;
        return Math.max(1, Math.min(Math.trunc(parsed), MAX_ARTICLES_LIMIT));
      }

      function normalizeTopic(value) {
        return String(value || "").trim() || DEFAULT_TOPIC;
      }

      function nextPrompt() {
        const nextTurn = state.turn + 1;
        if (nextTurn > state.rounds) return "Session completed.";
        return `Question ${nextTurn}/${state.rounds}: ask about count, titles, sources, or whether a keyword appears.`;
      }

      function answerQuestion(question) {
        const questionLower = question.toLowerCase();

        if (questionLower.includes("how many") || questionLower.includes("count")) {
          return `I fetched ${state.articles.length} articles.`;
        }

        if (questionLower.includes("titles") || questionLower.includes("list")) {
          const joined = state.articles.map((article) => article.title).join("; ");
          return `Here are the titles: ${joined}`;
        }

        if (questionLower.includes("source")) {
          const uniqueSources = [...new Set(state.articles.map((article) => article.source))].sort();
          return `Sources included: ${uniqueSources.join(", ")}`;
        }

        if (questionLower.includes("keyword") || questionLower.includes("about")) {
          const words = questionLower
            .split(/\s+/)
            .map((word) => word.replace(/^[^\w]+|[^\w]+$/g, ""))
            .filter((word) => word.length > MIN_KEYWORD_LENGTH);
          if (!words.length) return "Please include a more specific keyword.";
          const keyword = words.reduce((best, current) => current.length > best.length ? current : best, words[0]);
          const matches = state.articles
            .filter((article) => {
              const titleLower = article.title.toLowerCase();
              const descriptionLower = article.description.toLowerCase();
              return titleLower.includes(keyword) || descriptionLower.includes(keyword);
            })
            .map((article) => article.title);
          if (!matches.length) return `No article matched the keyword '${keyword}'.`;
          return `${matches.length} article(s) mention '${keyword}': ${matches.join("; ")}`;
        }

        return "I can answer questions about article count, titles, sources, or whether a keyword appears in the fetched news.";
      }

      function fallbackFor(topic, limit) {
        const topicLower = topic.toLowerCase();
        const filtered = fallbackArticles.filter((article) => `${article.title} ${article.description}`.toLowerCase().includes(topicLower));
        return (filtered.length ? filtered : fallbackArticles).slice(0, limit);
      }

      async function fetchArticles(topic, limit) {
        const params = new URLSearchParams({
          query: topic,
          tags: "story",
          hitsPerPage: String(limit)
        });
        try {
          const response = await fetch(`${NEWS_API_URL}?${params.toString()}`);
          if (!response.ok) throw new Error(`Request failed (${response.status})`);
          const payload = await response.json();
          if (!Array.isArray(payload.hits)) return fallbackFor(topic, limit);
          const articles = payload.hits.map((item) => ({
            title: String(item.title || "Untitled").trim() || "Untitled",
            description: "No description available.",
            source: "Hacker News",
            url: String(item.url || item.story_url || "").trim()
          }));
          return articles.length ? articles : fallbackFor(topic, limit);
        } catch {
          return fallbackFor(topic, limit);
        }
      }

      function renderArticles(articles) {
        articlesEl.textContent = "";
        state.articleTexts = [];
        for (const article of articles) {
          const item = document.createElement("li");
          const text = `${article.title}. ${article.description}`;
          item.textContent = text;
          articlesEl.appendChild(item);
          state.articleTexts.push(text);
        }
      }

      function resetSession() {
        state.turn = 0;
        promptEl.textContent = nextPrompt();
        questionInput.value = "";
        submitBtn.disabled = false;
        nextBtn.disabled = false;
        readBtn.disabled = state.articleTexts.length === 0;
        voiceBtn.disabled = !state.recognition || state.articleTexts.length === 0;
        voiceStatus.textContent = "";
      }

      startBtn.addEventListener("click", async () => {
        const topic = normalizeTopic(topicInput.value);
        const limit = normalizeLimit(limitInput.value);
        topicInput.value = topic;
        limitInput.value = String(limit);
        answerEl.textContent = "Loading headlines...";
        startBtn.disabled = true;
        try {
          const articles = await fetchArticles(topic, limit);
          state.articles = articles;
          renderArticles(articles);
          resetSession();
          answerEl.textContent = "Session started.";
        } finally {
          startBtn.disabled = false;
        }
      });

      submitBtn.addEventListener("click", () => {
        if (!state.articles.length) {
          answerEl.textContent = "Start a session first.";
          speakAnswer("Start a session first.");
          return;
        }
        const question = questionInput.value.trim();
        if (!question) {
          answerEl.textContent = "Please type a question first.";
          speakAnswer("Please type a question first.");
          return;
        }
        if (state.turn >= state.rounds) {
          answerEl.textContent = "Session is complete.";
          submitBtn.disabled = true;
          voiceBtn.disabled = true;
          promptEl.textContent = "Session completed.";
          speakAnswer("Session is complete.");
          return;
        }
        const answer = answerQuestion(question);
        answerEl.textContent = answer;
        speakAnswer(answer); // Speak the answer in voice mode
        state.turn += 1;
        promptEl.textContent = nextPrompt();
        if (state.turn >= state.rounds) {
          submitBtn.disabled = true;
          voiceBtn.disabled = true;
        }
        voiceStatus.textContent = ""; // Clear voice status after submission
      });

      nextBtn.addEventListener("click", () => {
        if (!state.articles.length) {
          answerEl.textContent = "Start a session first.";
          return;
        }
        promptEl.textContent = nextPrompt();
      });

      readBtn.addEventListener("click", () => {
        if (!("speechSynthesis" in window)) {
          answerEl.textContent = "This browser does not support speech synthesis.";
          return;
        }
        if (!state.articleTexts.length) {
          answerEl.textContent = "No articles available to read.";
          return;
        }
        window.speechSynthesis.cancel();
        for (const text of state.articleTexts) {
          const utterance = new SpeechSynthesisUtterance(text);
          window.speechSynthesis.speak(utterance);
        }
      });

      // Voice button click handler
      voiceBtn.addEventListener("click", () => {
        if (!state.recognition) {
          voiceStatus.textContent = "⚠️ Speech recognition not available";
          return;
        }
        if (state.isRecording) {
          state.recognition.stop();
          voiceStatus.textContent = "🛑 Stopped listening";
          return;
        }
        if (!state.articles.length) {
          answerEl.textContent = "Start a session first.";
          return;
        }
        if (state.turn >= state.rounds) {
          answerEl.textContent = "Session is complete. Start a new session.";
          return;
        }
        // Start recording
        try {
          state.recognition.start();
        } catch (error) {
          voiceStatus.textContent = "⚠️ Error starting voice recognition";
          console.error("Speech recognition error:", error);
        }
      });

      // Voice mode toggle handler
      voiceModeToggle.addEventListener("change", (e) => {
        state.voiceMode = e.target.checked;
        if (state.voiceMode) {
          voiceStatus.textContent = "✓ Voice mode enabled - answers will be spoken";
          // Load voices if not already loaded
          if ('speechSynthesis' in window) {
            window.speechSynthesis.getVoices();
          }
        } else {
          voiceStatus.textContent = "";
          window.speechSynthesis.cancel();
        }
      });

      // Load voices when they become available
      if ('speechSynthesis' in window) {
        window.speechSynthesis.onvoiceschanged = () => {
          window.speechSynthesis.getVoices();
        };
      }
    })();
  </script>
</body>
</html>
